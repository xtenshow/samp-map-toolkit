name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/windows/**'
      - 'requirements-windows.txt'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Package Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt pyinstaller
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name RadarTool src/windows/Radar_Tool_v8_DPI_Responsive.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RadarTool-Windows-EXE
          path: dist/RadarTool.exe
          if-no-files-found: error
          retention-days: 30
