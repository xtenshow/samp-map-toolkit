; GTA SA FSR 1

; Enable the plugin.
enabled = true

; Convert an exclusive-fullscreen D3D9 request to fullscreen borderless.
borderless_fullscreen = true

; FSR 1 quality preset: ultra_quality, quality, balanced, performance, or custom.
quality = performance

; Source resolution multiplier from 0.10 to 1.00. Used only when quality = custom.
render_scale = 0.50

; Enable RCAS sharpening after EASU.
rcas_enabled = true

; Enable FXAA after upscaling and optional sharpening.
fxaa_enabled = true

; RCAS sharpness stops, from 0.00 (sharpest) to 2.00 (softest).
sharpness = 0.00

; Key used to toggle FSR after the world loads.
toggle_key = F10

; Enable FSR automatically after the world becomes stable.
; When false, press toggle_key after loading or a device reset.
auto_enable = true

; Optional Present-based frame benchmark. Press benchmark_key in a stable world.
benchmark_enabled = false
benchmark_key = F11
benchmark_warmup_seconds = 5
benchmark_duration_seconds = 30

; Internal diagnostic pipeline. Keep world_hud_easu for normal gameplay.
; Pipeline stage: world_hud_easu keeps the 3D world and depth-dependent effects
; on low-resolution targets, then applies EASU+RCAS+FXAA before post-effects and HUD.
; Other values: world_probe, world_resources, world_bind, world_easu, single,
; compile, source, resources, stretch, scene, easu, or full.
pipeline_stage = world_hud_easu

; DynamicLOD adaptive controller
; F11 toggles DynamicLOD. It adjusts FSR custom resolution and GTA draw distances.
; Change target_fps to your desired performance target (e.g. 75, 90, 120, 144).
; The target is NOT an FPS cap: the controller changes resolution around this target.
; Changes to target_fps are detected live while the game is running (about once per second).
dynamic_lod_enabled = false
dynamic_lod_toggle_key = F11
dynamic_lod_target_fps = 60
dynamic_lod_min_quality = 30
dynamic_lod_max_quality = 100
dynamic_lod_response_speed = 1.0
dynamic_lod_recovery_speed = 0.5
dynamic_lod_hysteresis = 5
dynamic_lod_sample_interval = 500
dynamic_lod_min_render_scale = 0.40
dynamic_lod_far_clip = 350
dynamic_lod_lod_distance = 150
